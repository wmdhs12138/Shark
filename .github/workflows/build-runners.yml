name: build-runners

on:
  workflow_dispatch:
  push:
    paths:
      - "exploit/**"
      - ".github/workflows/build-runners.yml"
  pull_request:
    paths:
      - "exploit/**"
      - ".github/workflows/build-runners.yml"

permissions:
  contents: read

jobs:
  runners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Build per-kernel runners
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x exploit/build-all.sh
          ./exploit/build-all.sh

      - name: Verify Neo9 runner
        run: |
          set -e
          R=app/app/src/main/jniLibs/arm64-v8a/libk515197.so
          test -s "$R"
          readelf -l "$R" | grep -q '/system/bin/linker64'
          readelf -d "$R" | grep -q 'libc.so'
          file "$R"
          ls -lh app/app/src/main/jniLibs/arm64-v8a/libk*.so

      - name: Upload runners
        uses: actions/upload-artifact@v4
        with:
          name: shark-runners-arm64-v8a
          path: app/app/src/main/jniLibs/arm64-v8a/libk*.so
          if-no-files-found: error
          retention-days: 14

  apk:
    needs: runners
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download freshly built runners
        uses: actions/download-artifact@v4
        with:
          name: shark-runners-arm64-v8a
          path: app/app/src/main/jniLibs/arm64-v8a

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Match compileSdk release(37) with minorApiLevel = 0.
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Assemble debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shark-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
